[package]
name = "netsock"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
authors = ["shellrow <shellrow@foctal.com>"]
description = "Inspect TCP and UDP sockets and their owning processes"
readme = "README.md"
repository = "https://github.com/shellrow/netsock"
documentation = "https://docs.rs/netsock"
license = "MIT"
include = ["/src/**", "/examples/**", "/tests/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
keywords = ["network", "socket"]
categories = ["network-programming", "os"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-freebsd", "x86_64-unknown-netbsd"]

[dependencies]
bitflags = "2.11"
thiserror = "2.0"
serde = { version = "1", features = ["derive"], optional = true }

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = "0.9"
netlink-packet-core = "0.9"
netlink-packet-sock-diag = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
]

[dev-dependencies]
serde_json = "1.0"

[features]
serde = ["dep:serde"]

[[example]]
name = "get_netstat"
path = "examples/get_netstat.rs"

[[example]]
name = "serialize"
path = "examples/serialize.rs"
required-features = ["serde"]
